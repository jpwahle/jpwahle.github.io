<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects by Jan Philip Wahle</title>
  <meta name="description" content="Independent software projects by Jan Philip Wahle.">
  <style>
    :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { max-width: 760px; margin: 0 auto; padding: 72px 24px; line-height: 1.55; }
    h1 { font-size: clamp(2rem, 7vw, 3.6rem); line-height: 1.05; margin: 0 0 16px; letter-spacing: -0.04em; }
    .intro { font-size: 1.1rem; opacity: .72; margin-bottom: 40px; }
    .projects { display: grid; gap: 16px; }
    .project { display: block; padding: 24px; border: 1px solid color-mix(in srgb, currentColor 18%, transparent); border-radius: 16px; color: inherit; text-decoration: none; }
    .project:hover { border-color: currentColor; }
    .project h2 { margin: 0 0 8px; font-size: 1.2rem; }
    .project p { margin: 0; opacity: .72; }
    footer { margin-top: 48px; font-size: .9rem; opacity: .62; }
  </style>
</head>
<body>
  <main>
    <h1>Useful software, built with care.</h1>
    <p class="intro">Independent products by Jan Philip Wahle.</p>
    <section class="projects" aria-label="Projects">
      <!-- To add another SaaS later, duplicate one .project link below. -->
      <a class="project" href="https://checkmythesis.com/">
        <h2>Check My Thesis</h2>
        <p>Verify academic citations and review thesis integrity before submission.</p>
      </a>
      <a class="project" href="https://www.swipephotos.com/">
        <h2>SwipePhotos</h2>
        <p>A fast, gesture-first way to sort and clean up your iPhone photo library.</p>
      </a>
    </section>
  </main>
  <footer>Jan Philip Wahle · <a href="https://github.com/jpwahle">GitHub</a></footer>
</body>
</html>
